# ========================================================
# Antigravity Sandbox Centralized Configuration
# Single Source of Truth (SSOT) for host network isolation
# and container resource boundaries.
# ========================================================

NETWORK_NAME="agy_net"
BRIDGE_NAME="agy0"

# If empty, subnet is allocated automatically via native Docker IPAM.
# If CIDR is set (e.g. "172.16.151.0/24"), it is enforced explicitly.
SUBNET=""

DNS_PRIMARY="9.9.9.9"
DNS_SECONDARY="149.112.112.112"

READY_FILE="/run/agy-sandbox/network.ready"

# Container Resource Limits
PIDS_LIMIT="2048"
MEMORY_LIMIT="8g"
CPUS_LIMIT="4"
TMPFS_SIZE="2g"
