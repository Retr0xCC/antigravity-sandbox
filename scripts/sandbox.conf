# ========================================================
# Antigravity Sandbox Centralized Configuration
# Single Source of Truth (SSOT) for host network isolation,
# container resource boundaries, and CLI version pinning.
# ========================================================

NETWORK_NAME="agy_net"
BRIDGE_NAME="agy0"

# If empty, subnet is allocated automatically via native Docker IPAM.
# If CIDR is set (e.g. "172.16.151.0/24"), it is enforced explicitly.
SUBNET=""

DNS_PRIMARY="9.9.9.9"
DNS_SECONDARY="149.112.112.112"

READY_FILE="/run/agy-sandbox/network.ready"

# Container Resource Limits
PIDS_LIMIT="2048"
MEMORY_LIMIT="8g"
CPUS_LIMIT="4"
TMPFS_SIZE="2g"

# Antigravity CLI Version & Binary Patching Configuration
# AGY_VERSION: Target release version to install ('1.5.3', 'latest', or specific SemVer tag).
AGY_VERSION="1.5.3"

# AGY_PATCH: Apply QNIX-Dev eligibility patch to CLI binary ('true' or 'false').
AGY_PATCH="true"

# AGY_PINNED: Version pinning & auto-update lockdown ('true', 'false', or empty).
# When pinning is active, the binary is locked (chmod 555) and auto-updates are disabled.
# When empty (""), pinning is automatically inferred from the patch setting:
#   - AGY_PATCH="true"  -> Pinning is automatically enabled  (uses AGY_VERSION)
#   - AGY_PATCH="false" -> Pinning is automatically disabled (defaults to 'latest')
AGY_PINNED=""

# Antigravity CLI Eligibility Patcher Configuration (QNIX-Dev)
# PATCHER_REPO: Git repository URL for the eligibility patcher.
PATCHER_REPO="https://github.com/QNIX-Dev/eligibility-antigravity-patcher.git"

# PATCHER_COMMIT: Pinned immutable 40-character Git commit SHA for supply chain integrity.
PATCHER_COMMIT="90498f50353d414232f593dffe88899bc80b6312"

# Inter-Container Isolation & Volume Storage
# SHARED_CONFIG controls global configuration sharing (/home/vscode/.gemini-shared):
#   "readonly" - (Recommended) Global config is mounted read-only; auth is copied safely on init.
#   "isolated" - Complete isolation; no shared configuration volume is mounted.
#   "rw"       - Global config mounted read-write (use only during initial onboarding).
SHARED_CONFIG="readonly"

# SHARED_CACHE controls tool & package cache sharing (/home/vscode/.cache):
#   "false"    - (Recommended) Per-project isolated cache (agy-cache-<project>-<hash>), eliminating cache poisoning.
#   "true"     - Global shared cache volume (agy-shared-cache) to minimize disk usage.
SHARED_CACHE="false"
